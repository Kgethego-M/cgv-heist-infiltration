<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Heist Infiltration</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      #prompt, #subtitle {
        position: absolute; left: 50%; transform: translateX(-50%);
        color: white; font-family: sans-serif; text-align: center;
        pointer-events: none; display: none; z-index: 5;
      }
      #prompt { bottom: 18%; font-size: 20px; }
      #subtitle { bottom: 8%; font-style: italic; font-size: 16px; color: #cfe3ff; }
            #endScreen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.78); color: #eee; font-family: sans-serif;
        text-align: center; z-index: 20; cursor: pointer;
      }
      #endScreen h1 { font-size: 52px; letter-spacing: 4px; margin: 0 0 14px; }
      #endScreen.win h1 { color: #4caf7d; }
      #endScreen.lose h1 { color: #e05252; }
      #endScreen p { font-size: 18px; color: #cfe3ff; margin: 6px 0; }
      #endScreen .hint { font-size: 14px; color: #8899bb; margin-top: 26px; }
    </style>
  </head>
  <body>

    <div id="controlsPanel" style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.55); color:#eee; font-family:sans-serif; font-size:13px; padding:12px 16px; border-radius:8px; line-height:1.6; z-index:5;">
      <div><b>Controls</b></div>
      <div>WASD — Move</div>
      <div>Shift — Sprint</div>
      <div>Ctrl — Crouch</div>
      <div>C — Crawl (prone)</div>
      <div>Q — Hug wall (hold, face it first)</div>
      <div>Mouse — Look</div>
      <div>E — Interact</div>
      <div>V — Toggle camera view</div>
    </div>

    <canvas id="minimap" style="position:absolute; bottom:20px; right:20px; width:180px; height:180px; border:2px solid rgba(255,255,255,0.6); border-radius:50%; z-index:5;"></canvas>

    <div id="blocker" style="
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); color: white; font-family: sans-serif;
      cursor: pointer; z-index: 10;
    ">
      <div>Click to look around</div>
    </div>

    <!-- [E] interaction prompt + handler lines. Temporary feedback so the guard
         AI is testable — the Audio/UI owner replaces the subtitle with the real
         earpiece system (voice + audio) later. -->
    <div id="prompt"></div>
    <div id="subtitle"></div>
        <!-- Win/lose overlay — restart happens in place, no page refresh -->
    <div id="endScreen">
      <h1 id="endTitle"></h1>
      <p id="endMessage"></p>
      <p class="hint">Press R or click to play again</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
