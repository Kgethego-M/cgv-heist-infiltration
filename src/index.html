<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stealth Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a0a;
    font-family: sans-serif;
  }

  canvas { display: block; }

  #blocker {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    color: #eee;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
  }

  #prompt {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0, 0, 0, 0.5);
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 16px;
    display: none;
    z-index: 5;
  }

  #subtitle {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 18px;
    max-width: 70%;
    text-align: center;
    display: none;
    z-index: 5;
  }

  #minimap {
    position: absolute;
    top: 16px;
    right: 16px;
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.4);
    z-index: 5;
  }
</style>
</head>
<body>

  <div id="blocker">Click to play</div>
  <div id="prompt"></div>
  <div id="subtitle"></div>
  <canvas id="minimap" width="180" height="180"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>

</body>
</html>
